---
minimum_pre_commit_version: 2.4.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: check-ast

  # ----- Formatting ---------------------------------------------------------------------------->
  - repo: https://github.com/saltstack/pre-commit-remove-import-headers
    rev: 209beff8e11fed83f3f0863ccfd95aa663fffaf6  # 1.1.0
    hooks:
      - id: remove-import-headers

  - repo: https://github.com/saltstack/salt-rewrite
    rev: 8079cfb7f601e5dbad58b8449d85bb24f1e52082  # 2.5.2
    hooks:
      - id: salt-rewrite
        alias: rewrite-docstrings
        name: Salt extensions docstrings auto-fixes
        files: ^src/saltext/bmc/.*\.py$
        args: [--silent]

  - repo: https://github.com/saltstack/salt-rewrite
    rev: 8079cfb7f601e5dbad58b8449d85bb24f1e52082  # 2.5.2
    hooks:
      - id: salt-rewrite
        alias: rewrite-tests
        name: Rewrite the test suite
        files: ^tests/.*\.py$
        args: [--silent, -E, fix_docstrings]

  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # v3.21.2
    hooks:
      - id: pyupgrade
        name: Rewrite Code to be Py3.10+
        args: [--py310-plus]
        exclude: src/saltext/bmc/version.py

  - repo: https://github.com/PyCQA/isort
    rev: a333737ed43df02b18e6c95477ea1b285b3de15a  # 8.0.1
    hooks:
      - id: isort
        args: [--py 310]
        exclude: src/saltext/bmc/(__init__|version).py

  - repo: https://github.com/psf/black
    rev: c6755bb741b6481d6b3d3bb563c83fa060db96c9  # 26.3.1
    hooks:
      - id: black
        args: [-l 100]
        exclude: src/saltext/bmc/version.py

  - repo: https://github.com/adamchainz/blacken-docs
    rev: dda8db18cfc68df532abf33b185ecd12d5b7b326  # 1.20.0
    hooks:
      - id: blacken-docs
        args: [--skip-errors]
        files: ^src/saltext/bmc/.*\.py$
        additional_dependencies:
          - black==26.3.1
  # <---- Formatting -----------------------------------------------------------------------------

  # ----- Security ------------------------------------------------------------------------------>
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # 1.9.4
    hooks:
      - id: bandit
        alias: bandit-salt
        name: Run bandit against the code base
        # B701: jinja2 autoescape (Salt loaders don't use jinja envs here).
        # B415: pyghmi/IPMI is intentionally used as an optional fallback;
        # protocol choice is enforced per-profile in pillar.
        args: [--silent, -lll, --skip, "B701,B415"]
        exclude: src/saltext/bmc/version.py

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # 1.9.4
    hooks:
      - id: bandit
        alias: bandit-tests
        name: Run bandit against the test suite
        args: [--silent, -lll, --skip, "B701,B415"]
        files: ^tests/.*
  # <---- Security -------------------------------------------------------------------------------

  # ----- Code Analysis ------------------------------------------------------------------------->
  - repo: local
    hooks:
      - id: nox
        alias: lint-src
        name: Lint Source Code
        language: python
        entry: env -u FORCE_COLOR nox -e lint-code-pre-commit --
        files: ^((setup|noxfile)|src/.*)\.py$
        require_serial: true
        additional_dependencies:
          - nox==2026.2.9
          - uv==0.10.11

      - id: nox
        alias: lint-tests
        name: Lint Tests
        language: python
        entry: env -u FORCE_COLOR nox -e lint-tests-pre-commit --
        files: ^tests/.*\.py$
        require_serial: true
        additional_dependencies:
          - nox==2026.2.9
          - uv==0.10.11

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 694e2c0dfb4253d51f3c6c54b8f9fec0a16764dc  # v1.7.11.24
    hooks:
      - id: actionlint
        additional_dependencies:
          - shellcheck-py==0.11.0.1
  # <---- Code Analysis --------------------------------------------------------------------------
